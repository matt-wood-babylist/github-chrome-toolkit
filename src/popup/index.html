<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pending Checks Banner</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 10px;
        width: 250px;
      }
      body:has(#editor:not([hidden])) {
        width: 330px;
      }
      /* The PR the actions will act on. Shown so it is never a guess which pull
         request a session is about to open against. */
      #ref {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: GrayText;
        padding: 2px 6px 8px;
        overflow-wrap: anywhere;
      }
      #actions { display: flex; flex-direction: column; gap: 2px; }
      /* An explicit `display` outranks the `display: none` the UA stylesheet gives
         [hidden], so without this the link list stays on screen behind the editor.
         Matching the id plus the attribute wins on specificity — no !important. */
      #actions[hidden] { display: none; }
      /* Anchors, not buttons: navigating to the claude:// URL is the whole job,
         and the browser already knows how to hand a protocol off. */
      a.action {
        padding: 8px 10px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
        font-size: 13px;
      }
      a.action:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
      a.action:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }
      #empty { color: GrayText; font-size: 13px; padding: 6px; }
      #footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        padding: 6px 4px 0;
        border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      }
      #settings { color: GrayText; font-size: 12px; text-decoration: none; }
      #settings:hover { text-decoration: underline; }
      #editToggle {
        padding: 3px 6px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: GrayText;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #editToggle:hover { color: inherit; background: color-mix(in srgb, currentColor 10%, transparent); }
      #editor { padding: 4px; }
    </style>
  </head>
  <body>
    <div id="ref" hidden></div>
    <div id="actions"></div>
    <div id="empty" hidden></div>
    <div id="editor" hidden></div>
    <div id="footer">
      <button id="editToggle" type="button">Edit actions</button>
      <a id="settings" href="#">Settings…</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
